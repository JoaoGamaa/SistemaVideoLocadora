<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="Ir para o início">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M6 4.75h12A1.25 1.25 0 0 1 19.25 6v12A1.25 1.25 0 0 1 18 19.25H6A1.25 1.25 0 0 1 4.75 18V6A1.25 1.25 0 0 1 6 4.75Z" />
          <path d="M8 4.75 10 8M14 4.75 16 8M4.75 9h14.5" />
        </svg>
      </span>
      <span class="brand-copy">
        <strong>Locadora</strong>
        <small>Gestão de acervo</small>
      </span>
    </a>

    <nav aria-label="Navegação principal">
      <span class="nav-section">Visão geral</span>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" /></svg>
        </span>
        <span>Início</span>
      </a>

      <span class="nav-section">Acervo</span>
      <a routerLink="/titulos" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 5.75A1.75 1.75 0 0 1 6.75 4h10.5A1.75 1.75 0 0 1 19 5.75v12.5A1.75 1.75 0 0 1 17.25 20H6.75A1.75 1.75 0 0 1 5 18.25V5.75Z" /><path d="m10 9 5 3-5 3V9Z" /></svg>
        </span>
        <span>Títulos</span>
      </a>
      <a routerLink="/itens" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z" /><path d="m4 12 8 4.5 8-4.5M4 16.5l8 4.5 8-4.5" /></svg>
        </span>
        <span>Itens</span>
      </a>

      <span class="nav-section">Cadastros</span>
      <a routerLink="/atores" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.25" /><path d="M5.5 20c.45-4 2.7-6 6.5-6s6.05 2 6.5 6" /></svg>
        </span>
        <span>Atores</span>
      </a>
      <a routerLink="/diretores" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M7 4l2 6M13 4l2 6M19 4l1 3M5 10h14v9.25c0 .41-.34.75-.75.75H5.75a.75.75 0 0 1-.75-.75V10Z" /></svg>
        </span>
        <span>Diretores</span>
      </a>
      <a routerLink="/classes" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10" /></svg>
        </span>
        <span>Classes</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot" aria-hidden="true"></span>
      <span>
        <strong>Sistema acadêmico</strong>
        <small>Angular + Spring Boot</small>
      </span>
    </div>
  </aside>

  <div class="app-main">
    <main class="app-content">
      <router-outlet />
    </main>

    <footer>
      <span>Locadora · Gestão de acervo</span>
      <span>Projeto acadêmico</span>
    </footer>
  </div>
</div>
